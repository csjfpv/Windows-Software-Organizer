name: Build Windows release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm package:win
      - name: Prepare release assets and SHA-256 checksums
        shell: pwsh
        run: |
          Copy-Item 'release/Windows软件整理工具 0.1.3.exe' 'release/Windows-Software-Organizer-Portable.exe'
          Copy-Item 'release/Windows软件整理工具 Setup 0.1.3.exe' 'release/Windows-Software-Organizer-Setup.exe'
          Copy-Item 'LICENSE' 'release/LICENSE.txt'
          Copy-Item 'THIRD_PARTY_NOTICES.md' 'release/THIRD-PARTY-NOTICES.txt'
          Copy-Item 'ASSET_SOURCES.md' 'release/ASSET-SOURCES.txt'
          Copy-Item 'TRADEMARKS.md' 'release/TRADEMARKS.txt'
          Get-ChildItem release -File -Filter 'Windows-Software-Organizer-*.exe' | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/Windows-Software-Organizer-Portable.exe
            release/Windows-Software-Organizer-Setup.exe
            release/SHA256SUMS.txt
            release/LICENSE.txt
            release/THIRD-PARTY-NOTICES.txt
            release/ASSET-SOURCES.txt
            release/TRADEMARKS.txt
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: windows-software-organizer
          path: |
            release/Windows-Software-Organizer-Portable.exe
            release/Windows-Software-Organizer-Setup.exe
            release/SHA256SUMS.txt
            release/LICENSE.txt
            release/THIRD-PARTY-NOTICES.txt
            release/ASSET-SOURCES.txt
            release/TRADEMARKS.txt
