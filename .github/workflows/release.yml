name: Build Windows release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm package:win
      - name: Prepare release assets and SHA-256 checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "Tag '${{ github.ref_name }}' does not match package version '$version'."
          }
          Copy-Item "release/Windows软件整理工具 $version.exe" 'release/Windows-Software-Organizer-Portable.exe'
          Copy-Item "release/Windows软件整理工具 Setup $version.exe" 'release/Windows-Software-Organizer-Setup.exe'
          Copy-Item 'LICENSE' 'release/LICENSE.txt'
          Copy-Item 'THIRD_PARTY_NOTICES.md' 'release/THIRD-PARTY-NOTICES.txt'
          Copy-Item 'ASSET_SOURCES.md' 'release/ASSET-SOURCES.txt'
          Copy-Item 'TRADEMARKS.md' 'release/TRADEMARKS.txt'
          Get-ChildItem release -File -Filter 'Windows-Software-Organizer-*.exe' | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/Windows-Software-Organizer-Portable.exe
            release/Windows-Software-Organizer-Setup.exe
            release/SHA256SUMS.txt
            release/LICENSE.txt
            release/THIRD-PARTY-NOTICES.txt
            release/ASSET-SOURCES.txt
            release/TRADEMARKS.txt
          generate_release_notes: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: windows-software-organizer
          path: |
            release/Windows-Software-Organizer-Portable.exe
            release/Windows-Software-Organizer-Setup.exe
            release/SHA256SUMS.txt
            release/LICENSE.txt
            release/THIRD-PARTY-NOTICES.txt
            release/ASSET-SOURCES.txt
            release/TRADEMARKS.txt
